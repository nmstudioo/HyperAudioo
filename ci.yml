name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check assets/script.js
      - run: npx --yes html-validate index.html
      - run: npx --yes lhci autorun --collect.staticDistDir=. --assert.preset=lighthouse:no-pwa --assert.assertions.categories:performance=warn
